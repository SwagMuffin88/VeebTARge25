<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <script src="/node_modules/bootstrap/dist/js/bootstrap.js"></script>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <h2 class="my-5">Forms:</h2>
            
                <h3>Inputs</h3>
                <form action="">
                    <div class="mb-3">
                        <label for="exampleInputEmail" class="form-label">
                            Email address
                        </label>
                        <input
                            type="email"
                            class="form-control"
                            id="exampleInputEmail"
                            placeholder="name@example.com"
                        />

                        <div id="emailHelp" class="form-text">
                            We'll never share your email with anyone else.õ
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="exampleInputPassword" class="form-label">Password</label>
                        <input
                            type="password"
                            class="form-control"
                            id="exampleInputPassword"
                            placeholder="Enter your password"
                        />
                    </div>

                    <div class="mb-3">
                        <input
                            type="checkbox"
                            class="form-check-input"
                            id="exampleCheck1"
                        />

                        <label for="exampleCheck1" class="form-check-label">
                            Check me out
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>
            
            <div class="col-md-6">
                <h2 class="my-5">Radio/checkboxes</h2>

                <div class="form-check">
                    <input
                            type="checkbox"
                            class="form-check-input"
                            id="checkBox1"
                    />
                    <label for="checkBox1" class="form-check-label">
                        Check me out
                    </label>
                </div>

                <div class="form-check">
                    <input
                            type="checkbox"
                            class="form-check-input"
                            id="checkBox2"
                            checked="checked"
                    />
                    <label for="checkBox2" class="form-check-label">
                        Check me out
                    </label>
                </div>

                <div class="form-check">
                    <input
                            class="form-check-input"
                            type="checkbox"
                            id="parentCheckBox">
                    <label class="form-check-label" for="parentCheckBox">
                        Indeterminate checkbox
                    </label>
                </div>

                <div class="ms-3 mt-2">
                    <div class="form-check">
                        <input
                                class="form-check-input child-check"
                                type="checkbox"
                                id="c1">
                        <label class="form-check-label" for="c1">
                            Option 1
                        </label>
                    </div>

                    <div class="form-check">
                        <input
                                class="form-check-input child-check"
                                type="checkbox"
                                id="c2">
                        <label class="form-check-label" for="c2">
                            Option 2
                        </label>
                    </div>
                </div>

                <div class="form-check">
                    <input
                            class="form-check-input"
                            type="radio"
                            name="radioDefault"
                            id="radioDefault">
                    <label class="form-check-label" for="radioDefault">
                        Default radio
                    </label>
                </div>

                <div class="form-check">
                    <input
                            class="form-check-input"
                            type="radio"
                            name="radioDefault"
                            id="radioDefault2"
                            checked="checked">
                    <label class="form-check-label" for="radioDefault2">
                        Default checked radio
                    </label>
                </div>

                <div class="form-check">
                    <input
                            class="form-check-input"
                            type="radio"
                            name="radioDefault"
                            id="radioDefault3"
                            disabled="disabled">
                    <label class="form-check-label" for="radioDefault3">
                        Default disabled radio
                    </label>
                </div>
            </div>
        </div>
        
        <div class="row">
            <div class="col-md-6">
                <h3 class="my-5">Files</h3>
                
                <div class="form-file">
                    <input type="file" class="form-file-input" id="customFile" />
                    <label for="customFile" class="form-file-label">
                        <span class="form-file-text">Choose file</span>
                        <span class="form-file-button">Browse</span>
                    </label>
                </div>
                
                <h3 class="my-5">Range</h3>
                <label class="form-label" for="customRange1">Custom range</label>
                <input type="range" class="form-range" id="customRange1" />
                
            </div>
        </div>
    </div>
    <script src="indeterminate.js"></script>
</body>
</html>
