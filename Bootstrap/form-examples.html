<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Document</title>
    <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">
    <script src="/node_modules/bootstrap/dist/js/bootstrap.js"></script>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-md-6">
                <h2 class="my-5">Forms:</h2>
            
                <h3>Inputs</h3>
                <form action="">
                    <div class="mb-3">
                        <label for="exampleInputEmail" class="form-label">
                            Email address
                        </label>
                        <input
                            type="email"
                            class="form-control"
                            id="exampleInputEmail"
                            placeholder="name@example.com"
                        />

                        <div id="emailHelp" class="form-text">
                            We'll never share your email with anyone else.õ
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="exampleInputPassword" class="form-label">Password</label>
                        <input
                            type="password"
                            class="form-control"
                            id="exampleInputPassword"
                            placeholder="Enter your password"
                        />
                    </div>

                    <div class="mb-3">
                        <input
                            type="checkbox"
                            class="form-check-input"
                            id="exampleCheck1"
                        />

                        <label for="exampleCheck1" class="form-check-label">
                            Check me out
                        </label>
                    </div>

                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>
            
            <div class="col-md-6">
                <h2 class="my-5">Radio/checkboxes</h2>

                <div class="form-check">
                    <input
                            type="checkbox"
                            class="form-check-input"
                            id="checkBox1"
                    />
                    <label for="checkBox1" class="form-check-label">
                        Check me out
                    </label>
                </div>

                <div class="form-check">
                    <input
                            type="checkbox"
                            class="form-check-input"
                            id="checkBox2"
                            checked="checked"
                    />
                    <label for="checkBox2" class="form-check-label">
                        Check me out
                    </label>
                </div>

                <div class="form-check">
                    <input
                            class="form-check-input"
                            type="checkbox"
                            value=""
                            id="parentCheckBox">
                    <label class="form-check-label" for="parentCheckBox">
                        Indeterminate checkbox
                    </label>
                </div>

                <div class="ms-3 mt-2">
                    <div class="form-check">
                        <input
                                class="form-check-input child-check"
                                type="checkbox"
                                value=""
                                id="c1">
                        <label class="form-check-label" for="c1">
                            Option 1
                        </label>
                    </div>

                    <div class="form-check">
                        <input
                                class="form-check-input child-check"
                                type="checkbox"
                                value=""
                                id="c2">
                        <label class="form-check-label" for="c1">
                            Option 2
                        </label>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const parentCheckBox = document.getElementById("parentCheckBox");
        const children = document.querySelectorAll(".child-check")

        const c1 = document.getElementById("c1");
        const c2 = document.getElementById("c2");

        function updateParent() {
            const checked = [...children].filter(c => c.checked).length;

            if (checked === 0) {
                parentCheckBox.checked = false;
                parentCheckBox.indeterminate = true;
            } else if (checked === children.length) {
                parentCheckBox.checked = true;
                parentCheckBox.indeterminate = false;
            } else {
                parentCheckBox.checked = false;
                parentCheckBox.indeterminate = true;
            }
        }

        children.forEach(c => c.addEventListener("change", updateParent));

        parentCheckBox.addEventListener("change", () => {
            children.forEach( c => c.checked = this.checked)
            parentCheckBox.indeterminate = true;
        })

    </script>
</body>
</html>
